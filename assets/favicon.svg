  <text x="256" y="258"
        text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="232" font-weight="700" letter-spacing="-8"
        fill="#ffffff">RA</text>
</svg>
