<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RA">
  <!-- Solid indigo tile: reads clearly against both light and dark browser
       chrome, so no prefers-color-scheme variant is needed. -->
